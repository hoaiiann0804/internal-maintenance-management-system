# Cấu hình Nginx độc lập cho Maintenance API (KHÔNG ảnh hưởng đến cấu hình Ecommerce hiện tại)
server {
    listen 80;
    listen [::]:80;
    server_name api-maintenance.shopmini.io.vn;

    # Chuyển hướng HTTP sang HTTPS sau khi cài đặt SSL với Certbot
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # Timeouts phù hợp cho Excel export và background operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Giới hạn kích thước payload (15MB)
        client_max_body_size 15M;
    }
}
